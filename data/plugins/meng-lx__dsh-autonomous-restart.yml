url: https://github.com/meng-lx/dsh-autonomous-restart
name: meng-lx/dsh-autonomous-restart
category: session
description:
  en: 'Restart initiated by the agent itself, not by a button. The agent calls one tool, then the plugin takes over: it waits until every agent and background job on the host is idle, runs a visible ten-second countdown that a click, a scroll, or a key press cancels, then restarts DSH and wakes the original session so the agent carries on from its last sentence. No button, no manual entry: the tool is the only way in. Works on the official desktop app and the official web client; third-party shells are not supported out of the box. Windows only. Known risk: every restart makes the DSH desktop app write a fresh identity cookie into its profile and never prunes the old ones. Enough restarts and the cookie header outgrows the request limit, so the next launch dies with HTTP 431 and `desktop welcome: Web authentication failed`. This plugin restarts more often than a manual workflow, so it brings that day closer. Recovery: quit DSH, delete %APPDATA%\@deepseek-ai\dsh-desktop\Network\Cookies, relaunch (you will have to sign in again). If that trade-off is not acceptable, use a lighter restart approach or restart by hand instead.'
  zh: '由 agent 自己发起的重启，不是按钮。agent 调一个工具，之后由插件接管：等这台机器上所有 agent 与后台任务都空闲，走完十秒可见倒计时（点一下鼠标、滚一下滚轮、按任意键都会取消），再重启 DSH，并唤醒原会话让 agent 接着说下去。没有按钮、没有手动入口——工具是唯一入口。官方桌面端与官方网页端均已适配，第三方壳不在默认支持范围内。仅限 Windows。已知风险：每次重启都会让 DSH 桌面端往 profile 里写一份新的身份 cookie，旧的不清理；重启次数多了，cookie 会堆积到请求头超限，启动时变成 HTTP 431，报 desktop welcome: Web authentication failed，桌面端起不来。本插件比其他重启方式更频繁地触发重启，因此会加速这一堆积。自救：退出 DSH 后删掉 %APPDATA%\@deepseek-ai\dsh-desktop\Network\Cookies 再启动（会掉登录态，需要重新登录）。不能接受这个风险的话，请改用更轻的重启方式或手动重启。'